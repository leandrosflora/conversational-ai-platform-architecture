services:
  opa:
    image: openpolicyagent/opa:0.68.0-static
    container_name: conversational-ai-opa
    command:
      - run
      - --server
      - --addr=0.0.0.0:8181
      - /policy/platform.rego
    ports:
      - "8181:8181"
    volumes:
      - ./security/opa:/policy:ro
    healthcheck:
      test: ["CMD", "/opa", "eval", "true"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - security-control-plane

  security-control-plane:
    build:
      context: ./security/control-plane
    container_name: conversational-ai-security-control-plane
    environment:
      WORKLOAD_ISSUER: http://security-control-plane:8700
      WORKLOAD_PUBLIC_ISSUER: http://localhost:8700
      WORKLOAD_PRIVATE_KEY_PATH: /data/workload-private.pem
      OPA_URL: http://opa:8181/v1/data/platform/authz/allow
      # Local-only bootstrap credentials. Production must inject workload-bound
      # credentials from a secret manager or replace this bootstrap with SPIFFE/mTLS.
      WORKLOAD_BOOTSTRAP_SECRETS_JSON: >-
        {"whatsapp-bff":"local-whatsapp-bff-bootstrap-secret-000001","conversation-orchestrator":"local-conversation-orchestrator-bootstrap-0002","agent-runtime-renegotiation":"local-agent-runtime-renegotiation-bootstrap-03","agent-runtime-fatura-cartao":"local-agent-runtime-card-bootstrap-secret-04","tool-service-renegotiation":"local-tool-renegotiation-bootstrap-secret-0005","renegotiation-service":"local-renegotiation-service-bootstrap-secret-06","tool-service-cartao-credito":"local-tool-card-bootstrap-secret-0000007"}
    ports:
      - "8700:8700"
    volumes:
      - workload-identity-data:/data
    depends_on:
      opa:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8700/health/ready', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - security-control-plane

networks:
  security-control-plane:
    name: conversational-ai-security-control-plane

volumes:
  workload-identity-data:
