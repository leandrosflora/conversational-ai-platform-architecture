schemaVersion: 1
issuer: conversational-ai-platform
tenant:
  claim: tenant_id
  header: X-Tenant-Id
  format: uuid
rules:
  - id: whatsapp-to-orchestrator
    caller: whatsapp-bff
    audience: conversation-orchestrator
    methods: [POST]
    paths: [/messages]
    idempotency: optional
  - id: orchestrator-to-renegotiation-agent
    caller: conversation-orchestrator
    audience: agent-runtime-renegotiation
    methods: [POST]
    paths: [/process]
    idempotency: none
  - id: orchestrator-to-card-agent
    caller: conversation-orchestrator
    audience: agent-runtime-fatura-cartao
    methods: [POST]
    paths: [/process]
    idempotency: none
  - id: orchestrator-to-memory
    caller: conversation-orchestrator
    audience: conversation-memory-service
    methods: [GET, PUT, DELETE, POST]
    paths: [/sessions/**, /conversations/**]
    idempotency: required_for_post
  - id: renegotiation-agent-to-memory
    caller: agent-runtime-renegotiation
    audience: conversation-memory-service
    methods: [GET]
    paths: [/conversations/**, /users/**]
    idempotency: none
  - id: renegotiation-agent-to-knowledge
    caller: agent-runtime-renegotiation
    audience: knowledge-service
    methods: [GET]
    paths: [/search]
    idempotency: none
  - id: orchestrator-to-audit
    caller: conversation-orchestrator
    audience: conversation-audit-service
    methods: [POST]
    paths: [/journey-events]
    idempotency: required
  - id: orchestrator-to-handoff
    caller: conversation-orchestrator
    audience: conversation-handoff-service
    methods: [POST]
    paths: [/handoffs]
    idempotency: required
  - id: renegotiation-tool-to-domain
    caller: tool-service-renegotiation
    audience: renegotiation-service
    methods: [GET, POST]
    paths: [/clients/**, /contracts/**, /simulations/**, /agreements/**]
    idempotency: required_for_post
    obligations: [governed_tool, policy_id]
  - id: domain-to-core
    caller: renegotiation-service
    audience: core-bancario-mock
    methods: [GET, POST]
    paths: [/clients/**, /contracts/**, /simulations/**, /agreements/**]
    idempotency: required_for_post
  - id: card-tool-to-core
    caller: tool-service-cartao-credito
    audience: core-bancario-mock
    methods: [GET]
    paths: [/clients/*/card/limit, /clients/*/card/invoice]
    idempotency: none
