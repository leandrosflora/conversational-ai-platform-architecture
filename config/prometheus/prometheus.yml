global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [prometheus:9090]

  - job_name: jaeger
    metrics_path: /metrics
    static_configs:
      - targets: [jaeger:14269]

  - job_name: alloy
    metrics_path: /metrics
    static_configs:
      - targets: [alloy:12345]

  - job_name: alertmanager
    metrics_path: /metrics
    static_configs:
      - targets: [alertmanager:9093]

  - job_name: dotnet-services
    metrics_path: /metrics
    static_configs:
      - targets:
          - whatsapp-bff:8080
          - conversation-orchestrator:8080
          - renegotiation-service:8080
          - conversation-audit-service:8080
          - conversation-handoff-service:8080

  - job_name: python-services
    metrics_path: /metrics
    static_configs:
      - targets:
          - agent-runtime-renegotiation:8100
          - agent-runtime-fatura-cartao:8110
          - knowledge-service:8500
          - conversation-memory-service:8600
          - tool-service-renegotiation:8401
          - tool-service-cartao-credito:8411
