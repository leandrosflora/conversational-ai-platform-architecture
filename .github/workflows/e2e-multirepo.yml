name: Multi-repository E2E

on:
  workflow_dispatch:
    inputs:
      core_ref:
        description: Optional Core mock branch/tag/commit override
        required: false
        default: ""
        type: string
      run_load_test:
        description: Execute the signed webhook load baseline
        required: true
        default: true
        type: boolean
      run_online_evals:
        description: Execute deterministic evals against both running agent runtimes
        required: true
        default: true
        type: boolean
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: multi-repository-e2e
  cancel-in-progress: false

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      MULTIREPO_READ_TOKEN: ${{ secrets.MULTIREPO_READ_TOKEN }}
      RUN_LOAD_TEST: ${{ github.event_name != 'workflow_dispatch' || inputs.run_load_test }}
      RUN_ONLINE_EVALS: ${{ github.event_name != 'workflow_dispatch' || inputs.run_online_evals }}
    steps:
      - name: Require cross-repository read token
        run: |
          test -n "$MULTIREPO_READ_TOKEN" || {
            echo "::error::Configure MULTIREPO_READ_TOKEN with read-only access to the 12 service repositories."
            exit 1
          }

      - uses: actions/checkout@v7
        with:
          path: conversational-ai-platform-architecture
          token: ${{ secrets.MULTIREPO_READ_TOKEN }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Resolve release manifest to exact SHAs
        env:
          CORE_REF_OVERRIDE: ${{ github.event_name == 'workflow_dispatch' && inputs.core_ref || '' }}
        run: |
          python -m pip install --disable-pip-version-check pyyaml
          mkdir -p conversational-ai-platform-architecture/artifacts/e2e
          cp conversational-ai-platform-architecture/release/release-manifest.yaml \
            /tmp/runtime-release-manifest.yaml
          if [ -n "$CORE_REF_OVERRIDE" ]; then
            python - <<'PY'
          import os
          from pathlib import Path
          import yaml

          path = Path("/tmp/runtime-release-manifest.yaml")
          data = yaml.safe_load(path.read_text(encoding="utf-8"))
          for repository in data["repositories"]:
              if repository["name"] == "core-bancario-mock":
                  repository["ref"] = os.environ["CORE_REF_OVERRIDE"]
                  break
          else:
              raise SystemExit("core-bancario-mock is missing from release manifest")
          path.write_text(yaml.safe_dump(data, sort_keys=False), encoding="utf-8")
          PY
          fi
          python conversational-ai-platform-architecture/scripts/checkout-release.py \
            /tmp/runtime-release-manifest.yaml \
            "$GITHUB_WORKSPACE" \
            --reuse conversational-ai-platform-architecture \
            --lock conversational-ai-platform-architecture/artifacts/e2e/release-lock.yaml
          cp /tmp/runtime-release-manifest.yaml \
            conversational-ai-platform-architecture/artifacts/e2e/runtime-release-manifest.yaml

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: Execute locked builds, contracts, evals and signed-webhook E2E
        working-directory: conversational-ai-platform-architecture
        run: scripts/e2e-orchestrated.sh

      - name: Upload E2E evidence and locked release manifest
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: multi-repository-e2e-evidence
          if-no-files-found: error
          retention-days: 30
          path: conversational-ai-platform-architecture/artifacts/e2e
