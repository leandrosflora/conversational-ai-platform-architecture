name: Functional architecture

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-functional-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install validation dependencies
        run: pip install -r requirements-docs.txt

      - name: Compile functional validator
        run: python -m py_compile scripts/validate-functional-architecture.py

      - name: Validate functional architecture contracts
        run: python scripts/validate-functional-architecture.py
