name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  static-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install documentation dependencies
        run: pip install -r requirements-docs.txt

      - name: Write placeholder environment
        run: scripts/write-ci-env.sh

      - name: Validate Docker Compose configuration
        run: |
          docker compose -f docker-compose.yml -f docker-compose.override.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.override.yml config --format json > /tmp/compose.json

      - name: Validate canonical contracts against Compose
        run: |
          set -o pipefail
          python scripts/validate-contract-drift.py /tmp/compose.json 2>&1 | tee contract-validation.log

      - name: Upload contract validation diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: contract-validation-diagnostics
          if-no-files-found: error
          path: contract-validation.log

      - name: Validate Grafana Alloy configuration
        run: |
          docker run --rm \
            -v "$PWD/config/alloy/config.alloy:/etc/alloy/config.alloy:ro" \
            grafana/alloy:v1.16.1 \
            validate /etc/alloy/config.alloy

      - name: Validate Prometheus configuration and rules
        run: |
          docker run --rm --entrypoint /bin/promtool \
            -v "$PWD/config/prometheus:/etc/prometheus:ro" \
            prom/prometheus:v2.53.1 \
            check config /etc/prometheus/prometheus.yml
          docker run --rm --entrypoint /bin/promtool \
            -v "$PWD/config/prometheus/rules:/etc/prometheus/rules:ro" \
            prom/prometheus:v2.53.1 \
            check rules /etc/prometheus/rules/platform-alerts.yml

      - name: Validate Alertmanager configuration
        run: |
          docker run --rm --entrypoint /bin/amtool \
            -v "$PWD/config/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro" \
            prom/alertmanager:v0.32.1 \
            check-config /etc/alertmanager/alertmanager.yml

      - name: Validate automation scripts
        run: |
          bash -n scripts/ci-smoke.sh
          bash -n scripts/render-c4.sh
          bash -n scripts/verify-c4-generated.sh
          bash -n scripts/write-ci-env.sh
          bash -n scripts/e2e-multirepo.sh
          bash -n scripts/backup-local.sh
          bash -n scripts/restore-local.sh
          bash -n scripts/chaos-drill.sh
          python -m py_compile scripts/validate-contract-drift.py
          python -m py_compile scripts/validate-doc-freshness.py
          python scripts/validate-doc-freshness.py

      - name: Verify generated C4 diagrams
        run: scripts/verify-c4-generated.sh

      - name: Build MkDocs strictly
        run: mkdocs build --clean --strict

  render-diagrams:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}

      - name: Render C4 diagrams
        run: scripts/render-c4.sh

      - name: Synchronize generated diagrams on same-repository PRs
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git add docs/architecture/C4/*.svg docs/architecture/C4/*.png
          if git diff --cached --quiet; then
            echo "Generated diagrams already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: regenerate C4 artifacts"
          git push origin "HEAD:${{ github.head_ref }}"

      - name: Upload generated diagrams
        uses: actions/upload-artifact@v7
        with:
          name: c4-diagrams
          if-no-files-found: error
          path: |
            docs/architecture/C4/*.svg
            docs/architecture/C4/*.png

  link-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check documentation links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --max-retries 2
            --timeout 20
            --exclude-path site
            --exclude '^https://leandrosflora\.github\.io/conversational-ai-platform-architecture(?:/.*)?$'
            './README.md'
            './docs/**/*.md'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  security-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v7

      - name: Scan repository for critical vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Upload Trivy SARIF
        if: always() && github.actor != 'dependabot[bot]'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif

      - name: Generate SPDX SBOM
        if: always()
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Upload SBOM
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: architecture-sbom
          if-no-files-found: error
          retention-days: 30
          path: sbom.spdx.json

  infrastructure-smoke:
    needs: static-validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Write placeholder environment
        run: scripts/write-ci-env.sh

      - name: Run infrastructure smoke test
        run: scripts/ci-smoke.sh
