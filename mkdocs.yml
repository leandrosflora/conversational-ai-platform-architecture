site_name: Conversational AI Platform Architecture
site_description: Arquitetura de referência para IA conversacional com agentes, MCP, RAG, WhatsApp e observabilidade.
site_author: Leandro Flora
site_url: https://leandrosflora.github.io/conversational-ai-platform-architecture/
use_directory_urls: false
repo_name: leandrosflora/conversational-ai-platform-architecture
repo_url: https://github.com/leandrosflora/conversational-ai-platform-architecture
edit_uri: edit/main/docs/

theme:
  name: material
  language: pt-BR
  icon:
    logo: material/message-processing-outline
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: cyan
      toggle:
        icon: material/weather-night
        name: Usar tema escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Usar tema claro
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.share
    - content.code.copy

plugins:
  - search:
      lang: pt

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Início: index.md
  - Visão geral:
      - Contexto de negócio: context/business-context.md
      - Arquitetura C4: architecture/c4-context.md
      - Contexto implementado: architecture/c4-context-current.md
      - Contexto alvo: architecture/c4-context-target.md
      - Containers atuais: architecture/c4-container-current.md
      - Containers alvo: architecture/c4-container-target.md
      - Jornadas e sequências: architecture/sequence-diagrams.md
  - Arquitetura funcional:
      - Mapa de capacidades: functional/capability-map.md
      - Mapa de domínios: functional/domain-map.md
      - Contrato de skill: functional/skill-contract.md
      - Estados de jornada: functional/journey-state-contracts.md
      - Eventos de negócio: functional/business-events-catalog.md
      - Ciclo de handoff: functional/handoff-case-lifecycle.md
      - Contexto de identidade: functional/customer-identity-context.md
      - Governança do conhecimento: functional/knowledge-governance.md
      - KPIs funcionais: functional/business-kpi-map.md
      - Matriz de rastreabilidade: functional/traceability-matrix.md
  - Integração bancária:
      - Readiness para Core real: integration/banking-core-readiness.md
      - Checklist de onboarding: integration/core-onboarding-checklist.md
  - Serviços:
      - Mapa completo: contracts/services-map.md
      - WhatsApp BFF: services/whatsapp-bff.md
      - Conversation Orchestrator: services/conversation-orchestrator.md
      - Agent Runtime: services/agent-runtime-renegotiation.md
      - Tool Service MCP: services/tool-service-renegotiation.md
      - Renegotiation Service: services/renegotiation-service.md
      - Agent Runtime Fatura Cartão: services/agent-runtime-fatura-cartao.md
      - Tool Service Cartão Crédito: services/tool-service-cartao-credito.md
      - Core Bancário Mock: services/core-bancario-mock.md
      - Knowledge Service: services/knowledge-service.md
      - Conversation Memory: services/conversation-memory-service.md
      - Conversation Audit: services/conversation-audit-service.md
      - Conversation Handoff: services/conversation-handoff-service.md
      - Alertmanager: services/alertmanager.md
  - Contratos:
      - Eventos Kafka: contracts/kafka-events.md
      - Dados e ownership: contracts/data-stores.md
      - Segurança: security/security-architecture.md
      - Supply chain: security/supply-chain.md
      - Release e contratos executáveis: governance/release-contract-governance.md
  - Segurança:
      - Workload Identity e PDP: security/workload-identity-pdp.md
  - Decisões:
      - Kafka como fila durável: adr/0001-kafka-durable-webhook-queue.md
      - Arquitetura hexagonal: adr/0002-hexagonal-ports-and-adapters.md
      - MCP governado: adr/0003-mcp-governed-tool-calling.md
      - Resiliência: adr/0004-catch-log-continue-resilience.md
      - Outbox, tools e ordering: adr/0005-transactional-outbox-governed-tools-and-ordering.md
  - Operação:
      - Runbook: runbook.md
      - SLOs e alertas: operations/slo-alerting.md
      - Backup e recuperação: operations/disaster-recovery.md
      - Retenção e LGPD: governance/data-retention-lgpd.md
      - Carga e caos: testing/load-and-chaos.md
      - Evals de IA: testing/evals.md
      - Atualização de dependências: roadmap/platform-dependency-upgrades.md
      - Roadmap de produção: roadmap/production-readiness.md
  - Evidências:
      - Jornada E2E: validation/2026-07-13-e2e-journey.md
      - Hardening P1: validation/2026-07-18-p1-hardening-e2e.md
