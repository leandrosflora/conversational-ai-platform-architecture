  - Decisions:
      - Kafka as durable queue: adr/0001-kafka-durable-webhook-queue.md
      - Hexagonal architecture: adr/0002-hexagonal-ports-and-adapters.md
      - Governed MCP: adr/0003-mcp-governed-tool-calling.md
      - Resilience: adr/0004-catch-log-continue-resilience.md
      - Outbox, tools and ordering: adr/0005-transactional-outbox-governed-tools-and-ordering.md
  - Operations:
      - Runbook: runbook.md
      - SLOs and alerts: operations/slo-alerting.md
      - Backup and recovery: operations/disaster-recovery.md
      - Retention and LGPD: governance/data-retention-lgpd.md
      - Load and chaos: testing/load-and-chaos.md
      - AI evals: testing/evals.md
      - Dependency upgrades: roadmap/platform-dependency-upgrades.md
      - Production roadmap: roadmap/production-readiness.md
  - Evidence:
      - E2E journey: validation/2026-07-13-e2e-journey.md
      - P1 hardening: validation/2026-07-18-p1-hardening-e2e.md
