site_name: Conversational AI Platform Architecture
site_description: Reference architecture for enterprise conversational AI with agents, MCP, RAG, WhatsApp, transactional systems, security, and end-to-end observability.
site_author: Leandro Flora
site_url: https://leandrosflora.github.io/conversational-ai-platform-architecture/
use_directory_urls: false
repo_name: leandrosflora/conversational-ai-platform-architecture
repo_url: https://github.com/leandrosflora/conversational-ai-platform-architecture
edit_uri: edit/main/docs/

hooks:
  - scripts/mkdocs_english_default.py

watch:
  - docs

theme:
  name: material
  language: en
  icon:
    logo: material/message-processing-outline
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: cyan
      toggle:
        icon: material/weather-night
        name: Use dark theme
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Use light theme
  features:
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.share
    - content.code.copy

plugins:
  - search:
      lang:
        - en
        - pt
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          name: English
          default: true
          build: true
        - locale: pt
          name: Português (Brasil)
          build: true
          site_description: Arquitetura de referência para IA conversacional com agentes, MCP, RAG, WhatsApp e observabilidade.
          nav_translations:
            Home: Início
            Overview: Visão geral
            Business context: Contexto de negócio
            C4 architecture: Arquitetura C4
            Implemented context: Contexto implementado
            Target context: Contexto alvo
            Current containers: Containers atuais
            Target containers: Containers alvo
            Journeys and sequences: Jornadas e sequências
            Functional architecture: Arquitetura funcional
            Capability map: Mapa de capacidades
            Domain map: Mapa de domínios
            Skill contract: Contrato de skill
            Journey states: Estados de jornada
            Business events: Eventos de negócio
            Handoff lifecycle: Ciclo de handoff
            Identity context: Contexto de identidade
            Knowledge governance: Governança do conhecimento
            Functional KPIs: KPIs funcionais
            Traceability matrix: Matriz de rastreabilidade
            Banking integration: Integração bancária
            Real Core readiness: Readiness para Core real
            Onboarding checklist: Checklist de onboarding
            Services: Serviços
            Full map: Mapa completo
            MCP Tool Service: Tool Service MCP
            Card Billing Agent Runtime: Agent Runtime Fatura Cartão
            Credit Card Tool Service: Tool Service Cartão Crédito
            Banking Core Mock: Core Bancário Mock
            Contracts: Contratos
            Kafka events: Eventos Kafka
            Data and ownership: Dados e ownership
            Security: Segurança
            Release and executable contracts: Release e contratos executáveis
            Workload Identity and PDP: Workload Identity e PDP
            Decisions: Decisões
            Kafka as durable queue: Kafka como fila durável
            Hexagonal architecture: Arquitetura hexagonal
            Governed MCP: MCP governado
            Resilience: Resiliência
            Outbox, tools and ordering: Outbox, tools e ordering
            Operations: Operação
            SLOs and alerts: SLOs e alertas
            Backup and recovery: Backup e recuperação
            Retention and LGPD: Retenção e LGPD
            Load and chaos: Carga e caos
            AI evals: Evals de IA
            Dependency upgrades: Atualização de dependências
            Production roadmap: Roadmap de produção
            Evidence: Evidências
            E2E journey: Jornada E2E
            P1 hardening: Hardening P1
            P0 consistency: Consistência P0
            Per-service secrets: Segredos por serviço

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Overview:
      - Business context: context/business-context.md
      - C4 architecture: architecture/c4-context.md
      - Implemented context: architecture/c4-context-current.md
      - Target context: architecture/c4-context-target.md
      - Current containers: architecture/c4-container-current.md
      - Target containers: architecture/c4-container-target.md
      - Journeys and sequences: architecture/sequence-diagrams.md
  - Functional architecture:
      - Capability map: functional/capability-map.md
      - Domain map: functional/domain-map.md
      - Skill contract: functional/skill-contract.md
      - Journey states: functional/journey-state-contracts.md
      - Business events: functional/business-events-catalog.md
      - Handoff lifecycle: functional/handoff-case-lifecycle.md
      - Identity context: functional/customer-identity-context.md
      - Knowledge governance: functional/knowledge-governance.md
      - Functional KPIs: functional/business-kpi-map.md
      - Traceability matrix: functional/traceability-matrix.md
  - Banking integration:
